const fmt=(d,tz,opts={})=>new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false,...opts}).format(d);
function parts(d,tz){const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);const m=Object.fromEntries(p.map(x=>[x.type,x.value]));return {day:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(m.weekday),minute:(+m.hour%24)*60+(+m.minute),date:`${m.year}-${m.month}-${m.day}`};}

function goldOpen(d){const p=parts(d,'Etc/GMT-3');const m=p.minute,w=p.day;return (w>=1&&w<=5)&&m>=62&&m<1438;}
function nextChange(fn,now){const current=fn(now);let prev=now.getTime();for(let k=1;k<=8*24*60;k++){const t=now.getTime()+k*60000;if(fn(new Date(t))!==current){let lo=prev,hi=t;while(hi-lo>1000){const mid=Math.floor((lo+hi)/2);if(fn(new Date(mid))===current)lo=mid;else hi=mid;}return new Date(hi);}prev=t;}return null;}

// Office wall clock: Singapore reference time until a verified MT5 server feed is connected.
(function(){
 const ticks=document.getElementById('wallClockTicks');
 for(let i=0;i<12;i++){
  const a=i*Math.PI/6,major=i%3===0;
  const el=document.createElementNS('http://www.w3.org/2000/svg','line');
  const r1=major?26:29,r2=32;
  for(const [k,v] of Object.entries({x1:82+Math.sin(a)*r1,y1:76-Math.cos(a)*r1,x2:82+Math.sin(a)*r2,y2:76-Math.cos(a)*r2,stroke:'#c8ad81','stroke-width':major?2:1}))el.setAttribute(k,v);

 }
