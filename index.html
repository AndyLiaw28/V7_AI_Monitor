<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b0e"><title>V7 Autonomous Office</title><style>
:root{color-scheme:dark;--bg:#090b0e;--panel:#14191d;--gold:#d5b27a;--cream:#e4d7bf;--muted:#9ba09f;--red:#c57569}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:14px system-ui,'Noto Sans SC',sans-serif}.shell{max-width:1100px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:19px;letter-spacing:2px;color:var(--gold);font-weight:800}.sub{font-size:11px;color:var(--muted);margin-top:4px}.controls{display:flex;gap:7px}button{background:#20252a;color:var(--cream);border:1px solid #5d513e;border-radius:8px;padding:9px 11px;cursor:pointer}button.active{background:#56452d;border-color:var(--gold);color:#fff}.strip{border:1px solid #5d4d37;background:#101317;border-radius:9px;overflow:hidden;margin-top:12px}.striphead{padding:8px 12px;color:var(--gold);font-size:11px;letter-spacing:1px;display:flex;justify-content:space-between}.ticker{overflow:hidden;border-top:1px solid #393329;border-bottom:1px solid #393329;white-space:nowrap}.track{display:flex;width:max-content;animation:marquee 35s linear infinite}.track span{padding:11px 20px;white-space:nowrap;color:var(--ticker-color,#cdb081);font:600 12px ui-monospace,monospace;letter-spacing:.03em}.track .alert{animation:tickerAlert 1.6s ease-in-out infinite}@keyframes tickerAlert{50%{opacity:.42}}@keyframes marquee{to{transform:translateX(-50%)}}.notice{margin:12px 0;color:#b7a995;font-size:12px;line-height:1.5}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}.scene{background:#101317;border:1px solid #5c4e3a;border-radius:10px;padding:9px;overflow:hidden}.scene svg{display:block;width:100%;height:auto}.side{background:var(--panel);border:1px solid #554836;border-radius:10px;padding:14px}.section{font-size:13px;color:var(--gold);font-weight:700;letter-spacing:.6px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.stat{background:#0d1115;border:1px solid #353b3c;border-radius:7px;padding:10px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;margin-top:6px;color:var(--cream)}.agents{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.agentBtn{text-align:left;padding:9px 7px;font-size:12px}.agentBtn b{display:block;color:var(--gold)}.agentBtn small{display:block;margin-top:4px;color:var(--muted)}.agentBtn.chosen{border-color:var(--gold)}.detail{background:#0c1014;border:1px solid #514431;border-radius:8px;margin-top:12px;padding:12px;min-height:130px}.detail h3{margin:0 0 7px;color:var(--gold)}.detail p{margin:6px 0;color:#c8c3ba;line-height:1.55;font-size:12px}.log{max-height:150px;overflow:auto;font:11px ui-monospace,monospace;color:#c4ad86}.log div{padding:7px 0;border-bottom:1px solid #32302b}.footer{color:#8f9496;font-size:11px;text-align:center;padding:16px}.pulse{animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}.warn{color:#d9a370}.error{color:#e17c73}.statusDot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:currentColor}@media(max-width:750px){.layout{grid-template-columns:1fr}.brand{font-size:15px}.shell{padding:9px}.side{padding:12px}.agents{grid-template-columns:repeat(3,1fr)}}@media(prefers-reduced-motion:reduce){.track,.pulse,.track .alert{animation:none!important}}
</style></head><body><div class="shell"><header class="top"><div><div class="brand">V7 / WALL STREET AI</div><div class="sub" data-i18n="subtitle"></div></div><div class="controls"><button id="zh" class="active">中文</button><button id="en">EN</button></div></header><section class="strip"><div class="striphead"><span data-i18n="marketTicker"></span><span data-i18n="demo"></span></div><div class="ticker"><div class="track" id="marketTrack"></div></div></section><div class="notice" data-i18n="disclaimer"></div><div class="layout"><section class="scene"><svg id="office" viewBox="0 0 680 550" role="img" aria-label="V7 autonomous office"><rect width="680" height="550" fill="#101317"/><rect x="12" y="12" width="140" height="135" rx="6" fill="#14191d" stroke="#6a563d"/><text x="22" y="32" fill="#d5b27a" font-size="12" data-svg-i18n="clocks"></text><g id="clocks"></g><rect x="162" y="12" width="340" height="135" rx="6" fill="#14191d" stroke="#6a563d"/><text x="174" y="32" fill="#d5b27a" font-size="12">XAUUSD / M15</text><text x="488" y="32" fill="#a9a198" font-size="10" text-anchor="end" data-svg-i18n="demo"></text><g id="candles"></g><rect x="512" y="12" width="156" height="135" rx="6" fill="#14191d" stroke="#6a563d"/><text x="523" y="32" fill="#d5b27a" font-size="12" data-svg-i18n="events"></text><g id="eventBox"></g><g id="workstations"></g><rect x="250" y="510" width="180" height="25" rx="9" fill="#20252a" stroke="#68563d"/><text x="340" y="526" fill="#c7aa7a" font-size="10" text-anchor="middle" data-svg-i18n="officeLabel"></text></svg></section><aside class="side"><div class="section" data-i18n="overview"></div><div class="stats"><div class="stat"><small data-i18n="connection"></small><strong data-i18n="offline"></strong></div><div class="stat"><small data-i18n="dataSource"></small><strong data-i18n="simulation"></strong></div><div class="stat"><small data-i18n="tradeExecution"></small><strong data-i18n="disabled"></strong></div><div class="stat"><small data-i18n="activeWarnings"></small><strong id="warningCount">0</strong></div></div><div class="section" data-i18n="agentsTitle"></div><div class="agents" id="agentButtons"></div><div class="detail" id="detail"></div><div class="section" style="margin-top:14px" data-i18n="recentEvents"></div><div class="log" id="log"></div></aside></div><section class="strip"><div class="striphead"><span data-i18n="systemTicker"></span><span data-i18n="autoEvents"></span></div><div class="ticker"><div class="track" id="systemTrack"></div></div></section><div class="footer" data-i18n="footer"></div></div><script>
const dict={zh:{subtitle:'自主 AI 交易办公室 · 六个工作站独立运行',marketTicker:'市场资讯跑马灯',systemTicker:'系统事件跑马灯',demo:'演示 / 非实时',disclaimer:'⚠ 当前所有行情、时钟和事件均为模拟演示，未连接 MT5、V7 Engine 或新闻服务；不会进行真实交易。',clocks:'世界时钟',events:'系统事件',officeLabel:'六位 AI 工作员 · 同一办公室',overview:'系统总览',connection:'MT5 连接',offline:'未连接',dataSource:'数据来源',simulation:'模拟数据',tradeExecution:'交易执行',disabled:'已禁用',activeWarnings:'当前警报',agentsTitle:'工作站状态（点击查看详情）',recentEvents:'最新事件记录',autoEvents:'自动更新 · 演示',footer:'V7 AUTONOMOUS OFFICE · SVG V1.1 · 演示模式 · 未接入真实数据',working:'分析中',idle:'待命',passed:'已通过',warning:'警报',error:'故障',paused:'暂停',offlineState:'离线',recovery:'已恢复',role:['决策协调','市场扫描','信号验证','新闻监控','风险控制','系统诊断'],desc:['正在协调各工作站的分析与决策流程。','正在检查市场走势与多周期信号。','正在核验信号是否满足策略条件。','正在监控重要经济事件和新闻风险。','正在检查仓位、风险上限及回撤。','正在检查系统连接、日志和引擎状态。'],detailStatus:'当前状态',detailTask:'当前工作',detailReason:'状态说明',reason:{working:'正在执行模拟工作任务，显示器持续更新。',idle:'暂时没有待处理任务。',passed:'本轮检查已完成。',warning:'发现需要注意的模拟事件，请检查相关规则。',error:'模拟系统故障，相关功能应暂停。',paused:'由于其他环节的限制，当前流程已暂停。',offlineState:'数据连接中断，不能继续宣称实时分析。',recovery:'模拟恢复成功，等待下一轮任务。'},scenes:['市场扫描开始','重大新闻提醒','风险阈值警报','系统连接故障','系统恢复正常'],market:['黄金 XAUUSD · 模拟行情','SCAN · 分析 M15','VET · 信号核验','NEWS · 关注 FOMC','RISK · 回撤限制 10%','PILOT · 引擎健康检查'],clockCities:['纽约','伦敦','东京','新加坡'],selectHint:'点击工作站查看原因；不会改变其状态。'},en:{subtitle:'Autonomous AI trading office · Six independent workstations',marketTicker:'MARKET INFORMATION TICKER',systemTicker:'SYSTEM EVENT TICKER',demo:'DEMO / NOT LIVE',disclaimer:'⚠ All prices, clocks and events are simulated. No MT5, V7 Engine or news service is connected. No live trading occurs.',clocks:'WORLD CLOCKS',events:'SYSTEM EVENT',officeLabel:'SIX AI AGENTS · ONE OFFICE',overview:'SYSTEM OVERVIEW',connection:'MT5 CONNECTION',offline:'DISCONNECTED',dataSource:'DATA SOURCE',simulation:'SIMULATED',tradeExecution:'TRADE EXECUTION',disabled:'DISABLED',activeWarnings:'ACTIVE ALERTS',agentsTitle:'AGENT STATUS (TAP FOR DETAILS)',recentEvents:'RECENT EVENTS',autoEvents:'AUTO-UPDATING · DEMO',footer:'V7 AUTONOMOUS OFFICE · SVG V1.1 · DEMO MODE · NO LIVE FEED',working:'WORKING',idle:'IDLE',passed:'PASSED',warning:'WARNING',error:'ERROR',paused:'PAUSED',offlineState:'OFFLINE',recovery:'RECOVERED',role:['Decision coordination','Market scanning','Signal validation','News monitoring','Risk control','System diagnostics'],desc:['Coordinating analysis and decision workflow.','Checking market trends and multi-timeframe signals.','Validating strategy signal conditions.','Monitoring high-impact economic events.','Checking positions, risk limits and drawdown.','Checking system connections, logs and engine health.'],detailStatus:'Current status',detailTask:'Current task',detailReason:'Status explanation',reason:{working:'Performing a simulated task; displays are updating.',idle:'No pending task at present.',passed:'Current check completed.',warning:'A simulated warning needs review.',error:'Simulated system failure; affected functions should stop.',paused:'Workflow paused due to upstream restrictions.',offlineState:'Data connection lost; live analysis must not be claimed.',recovery:'Simulated recovery complete; awaiting next task.'},scenes:['Market scan started','High-impact news alert','Risk threshold warning','System connection failure','System recovered'],market:['Gold XAUUSD · Simulated feed','SCAN · M15 analysis','VET · Signal validation','NEWS · FOMC watch','RISK · 10% drawdown limit','PILOT · Engine health'],clockCities:['New York','London','Tokyo','Singapore'],selectHint:'Tap a workstation to inspect details; this does not change its state.'}};
const agentNames=['CHEF','SCAN','VET','NEWS','RISK','PILOT'];const sceneStates=[['working','working','working','idle','working','working'],['warning','working','paused','warning','warning','working'],['paused','working','paused','idle','error','warning'],['paused','offlineState','offlineState','offlineState','warning','error'],['working','working','working','working','passed','recovery']];const statusColors={working:'#cdb081',idle:'#899095',passed:'#83b69a',warning:'#d8a15f',error:'#c57569',paused:'#899095',offlineState:'#727b81',recovery:'#83b69a'};let lang='zh',scene=0,selected=4,history=[];const NS='http://www.w3.org/2000/svg';const tr=()=>dict[lang];const el=(tag,attrs={},txt)=>{const x=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))x.setAttribute(k,v);if(txt!==undefined)x.textContent=txt;return x};function add(g,tag,attrs,txt){const x=el(tag,attrs,txt);g.appendChild(x);return x}function text(g,x,y,s,size=10,color='#d5b27a',extra={}){return add(g,'text',{x,y,'font-size':size,fill:color,...extra},s)}function rect(g,x,y,w,h,fill,stroke='#66553e',rx=3){return add(g,'rect',{x,y,width:w,height:h,fill,stroke,rx})}function draw(){const states=sceneStates[scene],t=tr(),g=document.getElementById('workstations');g.replaceChildren();states.forEach((state,i)=>{const x=112+(i%3)*228,y=236+Math.floor(i/3)*178,c=statusColors[state],a=add(g,'g',{role:'button',tabindex:'0','aria-label':agentNames[i]+' '+t[state],style:'cursor:pointer'});a.addEventListener('click',()=>{selected=i;renderDetails();draw()});a.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=i;renderDetails();draw()}});rect(a,x-101,y-69,202,143,selected===i?'#1c1d1d':'#15191d',selected===i?'#d5b27a':'#594c3a',5);for(let j=0;j<2;j++){let mx=x-88+j*94;rect(a,mx,y-60,82,49,'#292c2f',state==='error'||state==='warning'?c:'#7d6b52',4);rect(a,mx+5,y-55,72,39,state==='error'?'#2d1a1b':'#0b1014','none',2);if(['error','warning'].includes(state)){text(a,mx+41,y-29,'!',26,c,{'text-anchor':'middle','font-weight':'bold'});if(state==='error')add(a,'circle',{cx:mx+70,cy:y-51,r:3,fill:c,class:'pulse'})}else if(state==='offlineState'){text(a,mx+41,y-31,'OFF',10,'#85888a',{'text-anchor':'middle'})}else{for(let k=0;k<3;k++)add(a,'line',{x1:mx+12,y1:y-45+k*10,x2:mx+60-k*8,y2:y-45+k*10,stroke:c,'stroke-width':1.5});if(state==='working'){const p=add(a,'rect',{x:mx+10,y:y-50,width:8,height:3,fill:'#e4c78d'});add(p,'animate',{attributeName:'x',values:`${mx+10};${mx+65};${mx+10}`,dur:(2+i*.3)+'s',repeatCount:'indefinite'})}}}rect(a,x-100,y+1,200,8,'#5b4c3b','none',0);add(a,'path',{d:`M${x-84} ${y+9}v24 M${x+84} ${y+9}v24`,stroke:'#554a3b','stroke-width':5});add(a,'path',{d:`M${x-19} ${y-4}Q${x} ${y-19} ${x+19} ${y-4}L${x+24} ${y+29}H${x-24}Z`,fill:'#292d30',stroke:'#988163','stroke-width':2});add(a,'path',{d:`M${x-19} ${y}l-19 8 M${x+19} ${y}l19 8`,stroke:'#cbb99a','stroke-width':7,'stroke-linecap':'round'});const head=add(a,'g');if(state==='working'){add(head,'animateTransform',{attributeName:'transform',type:'rotate',values:`-4 ${x} ${y-35};4 ${x} ${y-35};-4 ${x} ${y-35}`,dur:(2.7+i*.32)+'s',repeatCount:'indefinite'})}rect(head,x-23,y-68,46,54,'#d1c1a4','#8c795c',18);rect(head,x-18,y-52,36,23,'#1b2228','none',9);add(head,'line',{x1:x-11,x2:x+11,y1:y-40,y2:y-40,stroke:c,'stroke-width':4,'stroke-linecap':'round'});add(a,'circle',{cx:x+83,cy:y-73,r:4,fill:c,class:['warning','error'].includes(state)?'pulse':''});rect(a,x-48,y+38,96,30,'#0d1013','#786247',4);text(a,x,y+51,agentNames[i],12,'#d9b881',{'text-anchor':'middle'});text(a,x,y+63,t[state],9,c,{'text-anchor':'middle'})});document.getElementById('warningCount').textContent=states.filter(s=>['warning','error'].includes(s)).length;drawCandles();drawEvent();drawClocks()}
function drawCandles(){const g=document.getElementById('candles');g.replaceChildren();for(let k=0;k<20;k++){const v=42+Math.sin(k*.9+scene)*15+k*.8,x=176+k*15,y=135-v;add(g,'line',{x1:x,y1:y-10,x2:x,y2:y+16,stroke:'#c5a77b','stroke-width':1});rect(g,x-3,y,6,8+k%3*2,k%4===0?'#806a57':'#d0b182','none',0)}}function drawClocks(){const g=document.getElementById('clocks');g.replaceChildren();tr().clockCities.forEach((c,i)=>{text(g,22,55+i*24,c,10,'#bdb6a9');text(g,138,55+i*24,['21:24','02:24','10:24','09:24'][i],10,'#d5b27a',{'text-anchor':'end'})})}function drawEvent(){const g=document.getElementById('eventBox');g.replaceChildren();const states=sceneStates[scene],warn=states.some(s=>s==='error'||s==='warning'),c=warn?'#bf776a':'#a99372';rect(g,521,46,138,66,warn?'#281c1d':'#24221f',c,4);text(g,530,65,tr().scenes[scene],lang==='zh'?11:9,c);text(g,530,89,'DEMO / '+(scene+1)+'/5',10,'#bcb2a3');text(g,522,132,tr().simulation,10,'#a69b8d')}
function makeTicker(id,items){const target=document.getElementById(id);target.replaceChildren();for(let repeat=0;repeat<2;repeat++){const block=document.createElement('div');block.style.display='flex';block.setAttribute('aria-hidden',repeat?'true':'false');items.forEach(item=>{const span=document.createElement('span');const obj=typeof item==='string'?{text:item,state:'working'}:item;span.textContent=obj.text;span.style.setProperty('--ticker-color',statusColors[obj.state]||statusColors.working);if(obj.state==='error')span.className='alert';block.appendChild(span)});target.appendChild(block)}}function updateTickers(){const t=tr(),states=sceneStates[scene];const market=t.market.map((label,i)=>({text:label,state:i===3&&scene===1?'warning':i===4&&scene===2?'error':i===5&&scene===3?'error':'working'}));makeTicker('marketTrack',market);const system=[{text:t.scenes[scene],state:scene===2||scene===3?'error':scene===1?'warning':scene===4?'recovery':'working'},...agentNames.map((n,i)=>({text:n+' / '+t[states[i]],state:states[i]}))];makeTicker('systemTrack',system)}function renderDetails(){const t=tr(),state=sceneStates[scene][selected];document.getElementById('agentButtons').innerHTML=agentNames.map((n,i)=>`<button class="agentBtn ${selected===i?'chosen':''}" data-index="${i}"><b>${n}</b><small style="color:${statusColors[sceneStates[scene][i]]}">● ${t[sceneStates[scene][i]]}</small></button>`).join('');document.querySelectorAll('.agentBtn').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.index);renderDetails();draw()});const d=document.getElementById('detail');d.replaceChildren();const h=document.createElement('h3');h.textContent=agentNames[selected]+' / '+t.role[selected];d.appendChild(h);for(const [label,value] of [[t.detailStatus,t[state]],[t.detailTask,t.desc[selected]],[t.detailReason,t.reason[state]]]){const p=document.createElement('p');const b=document.createElement('b');b.textContent=label+'：';p.append(b,document.createTextNode(value));d.appendChild(p)}const hint=document.createElement('p');hint.style.color='#8e9496';hint.textContent=t.selectHint;d.appendChild(hint)}function renderText(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(x=>x.textContent=tr()[x.dataset.i18n]);document.querySelectorAll('[data-svg-i18n]').forEach(x=>x.textContent=tr()[x.dataset.svgI18n]);document.getElementById('zh').classList.toggle('active',lang==='zh');document.getElementById('en').classList.toggle('active',lang==='en');updateTickers();renderDetails();draw();renderLog()}function renderLog(){const box=document.getElementById('log');box.replaceChildren();history.slice(-6).reverse().forEach(h=>{const div=document.createElement('div');div.textContent=h.time+' · '+tr().scenes[h.scene];box.appendChild(div)})}function next(){scene=(scene+1)%sceneStates.length;history.push({scene,time:new Date().toLocaleTimeString(lang==='zh'?'zh-SG':'en-SG',{hour12:false})});updateTickers();renderDetails();draw();renderLog()}document.getElementById('zh').onclick=()=>{lang='zh';renderText()};document.getElementById('en').onclick=()=>{lang='en';renderText()};history.push({scene:0,time:new Date().toLocaleTimeString('zh-SG',{hour12:false})});renderText();setInterval(next,11000);
</script></body></html>
